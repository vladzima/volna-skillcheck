# Copy to .github/workflows/evaluate-instructions.yml in your own project.
# Supply reviewed, sanitized eval/before.md, eval/after.md, and eval/cases.json.
name: Evaluate instructions
on:
  workflow_dispatch:
    inputs:
      model:
        description: Explicit model ID available to your API key
        required: true
        type: string
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned release
        run: python -m pip install 'https://github.com/vladzima/volna-skillcheck/releases/download/v0.2.0/volna_skillcheck-0.2.0-py3-none-any.whl'
      - name: Compare revisions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_MODEL: ${{ inputs.model }}
        run: |
          python - <<'PY'
          import os, shlex, subprocess
          adapter = shlex.join(['volna-skillcheck-openai', '--model', os.environ['EVAL_MODEL']])
          result = subprocess.run([
              'volna-skillcheck', '--old', 'eval/before.md', '--new', 'eval/after.md',
              '--cases', 'eval/cases.json', '--adapter', adapter, '--out', 'reports/evaluation.json',
          ])
          raise SystemExit(result.returncode)
          PY
      # Reports contain full task data; this example intentionally does not upload them.
