name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.3.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate release identity
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          import volna_skillcheck
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'volna-skillcheck'
          assert project['version'] == volna_skillcheck.__version__
          assert os.environ['RELEASE_TAG'] == 'v' + project['version']
          PY
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/package-test"
          "$RUNNER_TEMP/package-test/bin/pip" install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-test/bin/volna-skillcheck" --version
          "$RUNNER_TEMP/package-test/bin/volna-skillcheck" \
            --old "$GITHUB_WORKSPACE/examples/old.md" \
            --new "$GITHUB_WORKSPACE/examples/new.md" \
            --cases "$GITHUB_WORKSPACE/examples/cases.json" \
            --adapter "python $GITHUB_WORKSPACE/examples/mock_adapter.py" \
            --out "$RUNNER_TEMP/release-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/volna-skillcheck/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish with a short-lived PyPI credential
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
