name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/volna-skillcheck-install"
          "$RUNNER_TEMP/volna-skillcheck-install/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/volna-skillcheck-install/bin/volna-skillcheck" --version
          for adapter in codex opencode claude openai; do
            "$RUNNER_TEMP/volna-skillcheck-install/bin/volna-skillcheck-$adapter" --help
          done
          "$RUNNER_TEMP/volna-skillcheck-install/bin/volna-skillcheck" \
            --old "$GITHUB_WORKSPACE/examples/old.md" \
            --new "$GITHUB_WORKSPACE/examples/new.md" \
            --cases "$GITHUB_WORKSPACE/examples/cases.json" \
            --adapter "python $GITHUB_WORKSPACE/examples/mock_adapter.py" \
            --out "$RUNNER_TEMP/installed-report.json"
